# Specify the version of the Docker Compose format
version: '3.8'

# Define the services that make up the application
services:
  # Service name: webhook-app
  webhook-app:
    # Build the Docker image from the current directory
    build:
      context: .
    # Map port 8080 on the host to port 80 in the container
    ports:
      - "8080:80"
    # Specify the name of the container
    container_name: webhook-app-container