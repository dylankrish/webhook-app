<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Support Agent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Manual Message Sender</h1>

  <label for="channel">Channel ID</label>
  <input type="text" id="channel" placeholder="Enter channel ID">

  <label for="message">Message</label>
  <textarea id="message" placeholder="Type your text here..."></textarea>


  <button id="sendBtn">Send</button>

  <div id="status" class="status"></div>

  <script>
    const messageInput = document.getElementById("message");
    const sendBtn = document.getElementById("sendBtn");
    const statusDiv = document.getElementById("status");

    async function sendToWebhook() {
      const url = "http://10.1.1.66:5678/webhook-test/b3b49535-ffd3-4827-a714-cb881b37ef53";
      const message = messageInput.value.trim();

      if (!message) {
        statusDiv.textContent = "Please enter a message.";
        statusDiv.style.color = "red";
        return;
      }

      sendBtn.disabled = true;
      statusDiv.textContent = "Sending...";
      statusDiv.style.color = "black";

      try {
        const channel = document.getElementById("channel").value.trim();
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ text: message, channel: channel })
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        statusDiv.textContent = "Message sent successfully.";
        statusDiv.style.color = "green";
      } catch (err) {
        statusDiv.textContent = "Failed to send: " + err.message;
        statusDiv.style.color = "red";
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", sendToWebhook);
  </script>
</body>
</html>
