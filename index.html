</head>
<body>
  <h1>Webhook Text Sender</h1>



  <label for="message">Message</label>
  <textarea id="message" placeholder="Type your text here..."></textarea>

  <button id="sendBtn">Send</button>

  <div id="status" class="status"></div>

  <script>
    const webhookInput = document.getElementById("webhookUrl");
    const messageInput = document.getElementById("message");
    const sendBtn = document.getElementById("sendBtn");
    const statusDiv = document.getElementById("status");

    async function sendToWebhook() {
      const url = "https://static-hardcoded-url.com/webhook";
      const message = messageInput.value.trim();

      if (!url) {
        statusDiv.textContent = "Please enter a webhook URL.";
        statusDiv.style.color = "red";
        return;
      }
      if (!message) {
        statusDiv.textContent = "Please enter a message.";
        statusDiv.style.color = "red";
        return;
      }

      sendBtn.disabled = true;
      statusDiv.textContent = "Sending...";
      statusDiv.style.color = "black";

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ text: message })
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        statusDiv.textContent = "Message sent successfully.";
        statusDiv.style.color = "green";
      } catch (err) {
        statusDiv.textContent = "Failed to send: " + err.message;
        statusDiv.style.color = "red";
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", sendToWebhook);
  </script>
</body>
</html>
